<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080f0a"/>
      <stop offset="100%" stop-color="#0d1a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow circles -->
  <circle cx="300" cy="200" r="300" fill="#2dd4bf" opacity="0.04" filter="url(#glow)"/>
  <circle cx="900" cy="450" r="250" fill="#34d399" opacity="0.03" filter="url(#glow)"/>

  <!-- Grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Logo icon -->
  <rect x="100" y="160" width="60" height="60" rx="16" fill="url(#logoGrad)" opacity="0.2"/>
  <path d="M130 175c-8 0-14 6-14 14 0 5 2.7 9.4 6.7 11.8V208a1.5 1.5 0 001.5 1.5h11.6a1.5 1.5 0 001.5-1.5v-7.2c4-2.4 6.7-6.8 6.7-11.8 0-8-6-14-14-14z" fill="url(#logoGrad)"/>
  <line x1="124" y1="191" x2="136" y2="191" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="125.5" y1="196" x2="134.5" y2="196" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Brand name -->
  <text x="178" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="url(#accent)">MindBridge</text>

  <!-- Colombia tag -->
  <rect x="100" y="240" width="130" height="24" rx="12" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1"/>
  <text x="165" y="257" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">🇨🇴 Colombia</text>

  <!-- Main headline -->
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="white">Tu bienestar</text>
  <text x="100" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="url(#accent)">mental, inteligente</text>

  <!-- Description -->
  <text x="100" y="510" font-family="system-ui, sans-serif" font-size="22" fill="#6b8a78">IA clínica · Psicólogos COLPSIC · Disponible 24/7 · Gratis para empezar</text>

  <!-- Right side — badges -->
  <rect x="900" y="200" width="200" height="70" rx="16" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <text x="1000" y="230" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🔒</text>
  <text x="1000" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#8aab96" text-anchor="middle">AES-256</text>

  <rect x="900" y="290" width="200" height="70" rx="16" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <text x="1000" y="320" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">👨‍⚕️</text>
  <text x="1000" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#8aab96" text-anchor="middle">COLPSIC</text>

  <rect x="900" y="380" width="200" height="70" rx="16" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <text x="1000" y="410" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">⚡</text>
  <text x="1000" y="435" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#8aab96" text-anchor="middle">24/7</text>

  <!-- Bottom line -->
  <line x1="100" y1="570" x2="1100" y2="570" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <text x="100" y="600" font-family="system-ui, sans-serif" font-size="16" fill="#3d5c48">mindbridge.co · Salud Mental Accesible en Colombia</text>
</svg>
