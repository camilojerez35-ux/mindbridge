name: Recordatorios de Citas Cron

# Vercel Hobby solo permite crons diarios; los recordatorios de citas (24h y 1h
# antes) necesitan revisar con más frecuencia para no perder ventanas de envío.
# La lógica de /api/notificaciones es idempotente (recordatorio24hEnviadoEn /
# recordatorio1hEnviadoEn), así que correr cada hora es seguro y se autorrecupera.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  recordatorios-24h:
    runs-on: ubuntu-latest
    steps:
      - name: Invocar /api/notificaciones?job=citas-24h
        run: |
          status=$(curl -s -o /tmp/respuesta-24h.txt -w "%{http_code}" \
            -X GET "https://mentebridge.com/api/notificaciones?job=citas-24h" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/respuesta-24h.txt
          if [ "$status" -ge 400 ]; then
            echo "Fallo con status $status"
            exit 1
          fi

  recordatorios-1h:
    runs-on: ubuntu-latest
    steps:
      - name: Invocar /api/notificaciones?job=citas-1h
        run: |
          status=$(curl -s -o /tmp/respuesta-1h.txt -w "%{http_code}" \
            -X GET "https://mentebridge.com/api/notificaciones?job=citas-1h" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/respuesta-1h.txt
          if [ "$status" -ge 400 ]; then
            echo "Fallo con status $status"
            exit 1
          fi
